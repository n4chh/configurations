; Ubuntu Light theme for fast-syntax-highlighting
; Based on Ubuntu Yaru Light color palette
; Darker tones used so colors stay readable on light/white backgrounds

[base]
default          = none
unknown-token    = red,bold,underline
commandseparator = 130
redirection      = 130,bold
here-string-tri  = 166
here-string-text = 94
here-string-var  = 130,bg:94
exec-descriptor  = 166,bold
comment          = 102,bold
recursive-base   = 130
correct-subtle   = 166
incorrect-subtle = red
subtle-separator = 130
subtle-bg        = bg:94
secondary        = free

[command-point]
reserved-word     = 130,bold
subcommand        = 166
alias             = 166
suffix-alias      = 166
global-alias      = bg:90
builtin           = 166
function          = 166
command           = 166,bold
precommand        = 130
hashed-command    = 130
single-sq-bracket = 130
double-sq-bracket = 130
double-paren      = 166

[paths]
path          = 90
pathseparator =
path-to-dir   = 90,underline
globbing      = 125,bold
globbing-ext  = 126

[brackets]
paired-bracket  = bg:90
bracket-level-1 = 166,bold
bracket-level-2 = 130,bold
bracket-level-3 = 94,bold

[arguments]
single-hyphen-option   = 96
double-hyphen-option   = 96
back-quoted-argument   = none
single-quoted-argument = 94
double-quoted-argument = 94
dollar-quoted-argument = 130
optarg-string          = 94
optarg-number          = 130

[in-string]
back-dollar-quoted-argument           = 166
back-or-dollar-double-quoted-argument = 166

[other]
variable             = 130
assign               = none
assign-array-bracket = 166
history-expansion    = 125,bold

[math]
mathvar = 166,bold
mathnum = 130
matherr = red

[for-loop]
forvar  = none
fornum  = 130
foroper = 166
forsep  = 130,bold

[case]
case-input       = 166
case-parentheses = 130
case-condition   = bg:90
