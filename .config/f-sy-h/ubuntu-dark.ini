; Ubuntu theme for fast-syntax-highlighting
; Based on Ubuntu Yaru color palette
; Orange #E95420 → 166/202, Aubergine #77216F → 89/125

[base]
default          = none
unknown-token    = red,bold,underline
commandseparator = 166
redirection      = 166,bold
here-string-tri  = 202
here-string-text = 52
here-string-var  = 208,bg:52
exec-descriptor  = 202,bold
comment          = 89,bold
recursive-base   = 166
correct-subtle   = 208
incorrect-subtle = red
subtle-separator = 166
subtle-bg        = bg:52
secondary        = free

[command-point]
reserved-word     = 166,bold
subcommand        = 202
alias             = 208
suffix-alias      = 208
global-alias      = bg:89
builtin           = 202
function          = 202
command           = 202,bold
precommand        = 166
hashed-command    = 208
single-sq-bracket = 166
double-sq-bracket = 166
double-paren      = 208

[paths]
path          = 139
pathseparator =
path-to-dir   = 139,underline
globbing      = 125,bold
globbing-ext  = 133

[brackets]
paired-bracket  = bg:89
bracket-level-1 = 202,bold
bracket-level-2 = 208,bold
bracket-level-3 = 166,bold

[arguments]
single-hyphen-option   = 96
double-hyphen-option   = 96
back-quoted-argument   = none
single-quoted-argument = 223
double-quoted-argument = 223
dollar-quoted-argument = 216
optarg-string          = 223
optarg-number          = 166

[in-string]
back-dollar-quoted-argument           = 208
back-or-dollar-double-quoted-argument = 208

[other]
variable             = 208
assign               = none
assign-array-bracket = 202
history-expansion    = 125,bold

[math]
mathvar = 202,bold
mathnum = 166
matherr = red

[for-loop]
forvar  = none
fornum  = 166
foroper = 208
forsep  = 202,bold

[case]
case-input       = 202
case-parentheses = 166
case-condition   = bg:89
