
SOURCE=#fe5d26
PRIMARY=#f2c078
SECONDARY=#c1dbb3
TERCIARY=#faedca
set -g default-terminal "screen-256color"
set -g status-style "bg=terminal fg=$SOURCE"
set -g status-justify left

set -g status-interval 1
set -g status-left "#(~/.config/tmux/left_status.sh)"
set -g status-right "#(~/.config/tmux/right_status.sh)"

# icons
# '' 
# ''
# ''
# ''

setw -g window-status-separator ' '
setw -g window-status-format "#(~/.config/tmux/window_status.sh)"
setw -g window-status-current-format "#(~/.config/tmux/window_status.sh active)"

set -g mouse on

set -g status-position top
set -g pane-border-style 'fg=terminal'
set -g pane-active-border-style "fg=$SOURCE"
bind r source ~/.config/tmux/tmux.conf
