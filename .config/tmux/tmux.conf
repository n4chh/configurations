set -g default-terminal "screen-256color"
set -g status-style 'bg=terminal fg=#1960a3'
set -g status-justify left

set -g status-left '#(~/.config/tmux/left_status.sh)'
set -g status-right '#(~/.config/tmux/right_status.sh)'

# icons
# '' 
# ''
# ''
# ''


set -g status-interval 1
setw -g window-status-separator ' '
setw -g window-status-format '#(~/.config/tmux/window_status.sh)'
setw -g window-status-current-format '#(~/.config/tmux/window_status.sh "active")'

set -g mouse on

set -g status-position top
set -g pane-border-style 'fg=terminal'
set -g pane-active-border-style 'fg=#1960a3'
bind r source /home/kali/.config/tmux/tmux.conf
