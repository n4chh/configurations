import = [
    "~/.config/alacritty/themes/themes/enfocado_light.toml"
]
#
[cursor]
thickness = 0.05

[cursor.style]
shape = "Underline"

[env]
TERM = "xterm-256color"

[font]
# size = 20.0
size = 16.0

[font.bold]
# family = "CaskaydiaCove Nerd Font Propo"
family = "SFMono Nerd Font"
style = "Bold"

[font.bold_italic]
# family = "CaskaydiaCove Nerd Font Propo"
family = "SFMono Nerd Font"
style = "Bold Italic"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
# family = "CaskaydiaCove Nerd Font Propo"
family = "SFMono Nerd Font"
style = "Italic"

[font.normal]
# family = "CaskaydiaCove Nerd Font Propo"
family = "SFMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[shell]
args = ["--login"]
program = "/bin/zsh"

[window]
# decorations = "Transparent"
decorations = "buttonless"
opacity = 0.70
blur = true
dynamic_padding = true

[window.padding]
x = 10
y = 10
